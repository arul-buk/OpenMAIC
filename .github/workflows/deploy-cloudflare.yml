name: Deploy OpenMAIC to Cloudflare Containers

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-deploy

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build upstream OpenMAIC base image
        run: |
          printf "\ncloudflare\n.github\n" >> .dockerignore
          docker build --platform linux/amd64 -t openmaic-upstream -f Dockerfile .

      - name: Install Cloudflare wrapper dependencies
        working-directory: cloudflare
        run: npm install --no-audit --no-fund

      - name: Deploy Worker and Container to Cloudflare
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Sync runtime secrets to Cloudflare Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          OPENMAIC_SECRET_KEY: ${{ secrets.OPENMAIC_SECRET_KEY }}
          OWNER_SINGLE_USER_ID: ${{ secrets.OWNER_SINGLE_USER_ID }}
        run: |
          node -e '
            const secrets = {
              DATABASE_URL: process.env.DATABASE_URL,
              GOOGLE_API_KEY: process.env.GOOGLE_API_KEY,
              ACCESS_CODE: process.env.ACCESS_CODE,
              OPENMAIC_SECRET_KEY: process.env.OPENMAIC_SECRET_KEY,
              OWNER_SINGLE_USER_ID: process.env.OWNER_SINGLE_USER_ID,
            };
            process.stdout.write(JSON.stringify(secrets));
          ' | npx wrangler secret bulk
