# OpenMAIC model configuration — Gemini-only, locked for family evaluation
# Contains no secrets; runtime credentials are injected via Cloudflare Worker Secrets.
providers:
  google:
    preset: google
    apiKey: ${GOOGLE_API_KEY}
    models:
      - gemini-2.5-flash
      - gemini-2.5-pro
      - gemini-3.5-flash

  google-tts:
    preset: google-tts
    apiKey: ${GOOGLE_API_KEY}
    models:
      - gemini-2.5-flash-preview-tts

slots:
  llm: google:gemini-2.5-flash
  tts: google-tts:gemini-2.5-flash-preview-tts
  video: null

# Prevent visitors from adding external keys or unapproved providers
allowUserKeys: false
