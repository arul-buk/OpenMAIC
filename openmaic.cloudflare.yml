# OpenMAIC model configuration — Neon (medium effort) for content creation, Hydrogen for fast chat/actions
# Contains no secrets; runtime credentials are injected via Cloudflare Worker Secrets.
providers:
  google:
    preset: google
    apiKey: ${GOOGLE_API_KEY}
    models:
      - gemini-4-neon
      - gemini-4-hydrogen
      - gemini-3.8-flash

  google-tts:
    preset: google-tts
    apiKey: ${GOOGLE_API_KEY}
    models:
      - gemini-3.8-flash-lite-tts
      - gemini-3.8-flash-tts

slots:
  # Default fast model for lightweight tasks, research, and agents
  llm:
    model: google:gemini-4-hydrogen
    fallback: google:gemini-3.8-flash

  # Content creation (course outlines, slides, quizzes, interactive simulations, PBL)
  course.outline:
    model: google:gemini-4-neon
    thinking:
      effort: medium
    fallback: google:gemini-4-hydrogen
  course.content:
    model: google:gemini-4-neon
    thinking:
      effort: medium
    fallback: google:gemini-4-hydrogen

  # Fast classroom chat, scene actions, and workbench agent
  course.actions: google:gemini-4-hydrogen
  classroom: google:gemini-4-hydrogen
  agent: google:gemini-4-hydrogen
  agent.title: google:gemini-4-hydrogen

  tts: google-tts:gemini-3.8-flash-lite-tts
  video: null

# Prevent visitors from adding external keys or unapproved providers
allowUserKeys: false
